<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Intelligence Console</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 950px;
      margin: 24px auto;
      padding: 0 16px;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 160px;
      background: #090d16;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      box-sizing: border-box;
      resize: vertical;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0 24px 0;
    }
    button {
      padding: 8px 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #1d4ed8; }
    button.alt-btn { background: #0284c7; }
    button.alt-btn:hover { background: #0369a1; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    .node-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .node-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-family: monospace;
      font-size: 15px;
    }
    .ip-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
    }
    .user-tag {
      color: #f1f5f9;
      background: #334155;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .hardware-tag {
      color: #94a3b8;
      font-size: 12px;
      font-style: italic;
    }
    .stat-badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-fw {
      background: #451a03;
      color: #f97316;
      border: 1px solid #7c2d12;
    }
    .badge-enc {
      background: #3b0764;
      color: #c084fc;
      border: 1px solid #581c87;
    }
    .badge-slots {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #065f46;
      font-size: 12px;
    }
    .wallet-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0;
    }
    .wallet-tag {
      background: #0f172a;
      border: 1px solid #0284c7;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    .software-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
    .tag-software {
      color: #4ade80;
      border: 1px solid #166534;
      background: #052e16;
    }
    .tag-uploaded {
      color: #fb923c;
      border: 1px solid #9a3412;
      background: #271406;
    }
    .history-list {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #334155;
      font-family: monospace;
      font-size: 11px;
      color: #94a3b8;
      max-height: 140px;
      overflow-y: auto;
    }
    .history-entry { padding: 2px 0; white-space: nowrap; }
    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin: 20px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin: 0;">Target Intelligence Console</h2>
    <button id="clearBtn" class="danger">Wipe Database</button>
  </div>

  <textarea id="dataInput" placeholder="Paste data here (Your Logs, Victim Logs, Home Screen, or Software Screen)..."></textarea>
  
  <div class="controls">
    <button id="processMyLogsBtn">Process My Logs</button>
    <button id="processVictimLogsBtn" style="background: #e11d48;">Process Victim Logs</button>
    <button id="processHomeBtn" class="alt-btn">Process Victim Home</button>
    <button id="processSoftwareBtn" class="alt-btn">Process Victim Software</button>
  </div>

  <div class="section-title" style="color: #60a5fa;">Full Targets</div>
  <div id="fullIpContainer"></div>

  <div class="section-title" style="color: #fbbf24;">Partial / Masked Targets</div>
  <div id="partialIpContainer"></div>

  <script src="app.js"></script>
</body>
</html>
