<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Target Intelligence Console</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 950px;
      margin: 16px auto;
      padding: 0 12px;
      background: #0b1120;
      color: #e2e8f0;
      -webkit-text-size-adjust: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #050811;
      color: #38bdf8;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 16px; /* Prevents mobile browser auto-zooming */
      box-sizing: border-box;
      resize: vertical;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 20px 0;
    }
    button {
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      touch-action: manipulation;
    }
    button:hover { background: #1d4ed8; }
    button.alt-btn { background: #0284c7; }
    button.alt-btn:hover { background: #0369a1; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }

    /* Target Node Card Styling */
    .node-card {
      background: #131d31;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .node-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      font-size: 14px;
    }
    .node-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .action-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      min-height: 32px;
    }
    .action-btn:hover {
      background: #334155;
      color: #f8fafc;
    }
    .action-btn.del-btn:hover {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #991b1b;
    }

    .ip-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .user-tag {
      color: #f1f5f9;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .hardware-tag {
      color: #64748b;
      font-size: 12px;
    }
    .stat-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-fw {
      background: #451a03;
      color: #fb923c;
      border: 1px solid #7c2d12;
    }
    .badge-enc {
      background: #3b0764;
      color: #c084fc;
      border: 1px solid #581c87;
    }
    .wallet-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 6px 0;
    }
    .wallet-tag {
      background: #0b1329;
      border: 1px solid #0369a1;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }

    /* Structured Software Grid */
    .software-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin: 10px 0 6px 0;
      font-weight: 700;
    }
    .software-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 6px;
    }
    .sw-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    .sw-loot {
      background: #062b1b;
      border: 1px solid #166534;
      color: #4ade80;
    }
    .sw-upload {
      background: #271406;
      border: 1px solid #9a3412;
      color: #fb923c;
    }

    .history-list {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      font-family: monospace;
      font-size: 11px;
      color: #64748b;
      max-height: 120px;
      overflow-y: auto;
    }
    .history-entry { 
      padding: 3px 0; 
      white-space: pre-wrap; 
      word-break: break-all; 
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      margin: 18px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Mobile-Specific Adaptations */
    @media (max-width: 600px) {
      body {
        padding: 0 8px;
        margin: 10px auto;
      }
      .controls button {
        flex: 1 1 calc(50% - 6px);
        padding: 12px 6px;
        font-size: 13px;
      }
      .node-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .node-actions {
        width: 100%;
        justify-content: flex-end;
        border-top: 1px solid #1e293b;
        padding-top: 8px;
      }
      .action-btn {
        flex: 1;
        text-align: center;
        padding: 8px 0;
      }
      .software-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin: 0; font-size: 18px;">Target Intelligence Console</h2>
    <button id="clearBtn" class="danger" style="padding: 6px 10px; font-size: 12px;">Wipe DB</button>
  </div>

  <textarea id="dataInput" placeholder="Paste data here (Logs, Home Screen, or Software Screen)..."></textarea>
  
<div class="controls">
    <button id="processMyLogsBtn">Process My Logs</button>
    <button id="processVictimLogsBtn" style="background: #e11d48;">Process Victim Logs</button>
    <button id="processHomeBtn" class="alt-btn">Victim Home</button>
    <button id="processSoftwareBtn" class="alt-btn">Victim Software</button>
    <button id="undoBtn" style="background: #475569;" disabled>Undo Last Ingest</button>
  </div>

  <div class="section-title" style="color: #60a5fa;">Full Targets</div>
  <div id="fullIpContainer"></div>

  <div class="section-title" style="color: #fbbf24;">Partial / Masked Targets</div>
  <div id="partialIpContainer"></div>

  <script src="app.js"></script>
</body>
</html>
