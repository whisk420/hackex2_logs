<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Aggregator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
      background: #121212;
      color: #e0e0e0;
    }
    textarea {
      width: 100%;
      height: 140px;
      background: #1e1e1e;
      color: #00ff66;
      border: 1px solid #333;
      padding: 10px;
      font-family: monospace;
      box-sizing: border-box;
      resize: vertical;
    }
    .controls {
      margin: 12px 0;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    .node-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .node-header {
      font-weight: bold;
      color: #38bdf8;
      font-family: monospace;
      font-size: 16px;
    }
    .node-details {
      margin-top: 6px;
      font-size: 14px;
    }
    .tag {
      display: inline-block;
      background: #27272a;
      border: 1px solid #3f3f46;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h2>Log Processor & Aggregator</h2>
  <textarea id="logInput" placeholder="Paste game logs here..."></textarea>
  
  <div class="controls">
    <button id="processBtn">Process & Merge</button>
    <button id="clearBtn" class="danger">Wipe Database</button>
  </div>

  <h3>Tracked Targets</h3>
  <div id="outputContainer"></div>

  <script src="app.js"></script>
</body>
</html>
